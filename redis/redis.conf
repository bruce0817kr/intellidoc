# Redis 개발용 설정
# IntelliDoc 개발 환경용 설정 파일

# 기본 설정
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# 일반 설정
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# 스냅샷 설정 (RDB)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# 메모리 관리
maxmemory 128mb
maxmemory-policy volatile-lru

# AOF 설정
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes

# 개발용 사용자 설정
notify-keyspace-events Ex
slowlog-log-slower-than 10000
slowlog-max-len 128

# 보안 설정 - 개발 환경에서는 암호 없음
# requirepass devpassword

# 개발 환경 튜닝
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes
