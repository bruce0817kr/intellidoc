version: '3.8'

services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intellidoc}
      POSTGRES_USER: ${POSTGRES_USER:-intellidoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intellidoc123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - intellidoc_network

  # Redis (Celery 백엔드용)
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - intellidoc_network
    command: redis-server --appendonly yes

  # IntelliDoc 백엔드
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # 데이터베이스 설정
      DATABASE_URL: postgresql://${POSTGRES_USER:-intellidoc}:${POSTGRES_PASSWORD:-intellidoc123}@postgres:5432/${POSTGRES_DB:-intellidoc}
      
      # Redis 설정
      REDIS_URL: redis://redis:6379/0
      
      # OCR 엔진 설정
      TESSERACT_LANG: ${TESSERACT_LANG:-kor+eng}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      MISTRAL_API_URL: ${MISTRAL_API_URL:-https://api.mistral.ai/v1/chat/completions}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-pixtral-12b-2409}
      
      # 기타 설정
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      UPLOAD_DIR: /app/uploads
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # 배치 처리 설정
      BATCH_MAX_WORKERS: ${BATCH_MAX_WORKERS:-4}
      BATCH_USE_PROCESSES: ${BATCH_USE_PROCESSES:-false}
      
      # 보안 설정
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - intellidoc_network
    restart: unless-stopped

  # Celery Worker (배치 처리용)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # 데이터베이스 설정
      DATABASE_URL: postgresql://${POSTGRES_USER:-intellidoc}:${POSTGRES_PASSWORD:-intellidoc123}@postgres:5432/${POSTGRES_DB:-intellidoc}
      
      # Redis 설정
      REDIS_URL: redis://redis:6379/0
      
      # OCR 엔진 설정
      TESSERACT_LANG: ${TESSERACT_LANG:-kor+eng}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      MISTRAL_API_URL: ${MISTRAL_API_URL:-https://api.mistral.ai/v1/chat/completions}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-pixtral-12b-2409}
      
      # 기타 설정
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      UPLOAD_DIR: /app/uploads
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # 배치 처리 설정
      BATCH_MAX_WORKERS: ${BATCH_MAX_WORKERS:-4}
      BATCH_USE_PROCESSES: ${BATCH_USE_PROCESSES:-false}
    volumes:
      - uploads_data:/app/uploads
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - intellidoc_network
    command: celery -A shared.celery worker --loglevel=info --concurrency=${CELERY_WORKERS:-4}
    restart: unless-stopped

  # Celery Beat (스케줄러)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # 데이터베이스 설정
      DATABASE_URL: postgresql://${POSTGRES_USER:-intellidoc}:${POSTGRES_PASSWORD:-intellidoc123}@postgres:5432/${POSTGRES_DB:-intellidoc}
      
      # Redis 설정
      REDIS_URL: redis://redis:6379/0

      # 기타 설정
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - intellidoc_network
    command: celery -A shared.celery beat --loglevel=info
    restart: unless-stopped

  # Flower (Celery 모니터링)
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      - redis
    networks:
      - intellidoc_network
    command: celery -A shared.celery flower --port=5555
    restart: unless-stopped

  # IntelliDoc 프론트엔드
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
      REACT_APP_VERSION: ${REACT_APP_VERSION:-1.0.0}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - intellidoc_network
    restart: unless-stopped

  # Nginx (리버스 프록시)
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - uploads_data:/var/www/uploads
    depends_on:
      - backend
      - frontend
    networks:
      - intellidoc_network
    restart: unless-stopped

# 네트워크 설정
networks:
  intellidoc_network:
    driver: bridge

# 볼륨 설정
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
